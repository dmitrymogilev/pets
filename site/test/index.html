<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pets smoke tests</title>
</head>
<body>
<h1>Spot smoke tests</h1>
<p><a href="/">Back</a></p>
<pre id="me">loading identity...</pre>
<p id="denied" hidden>This page is for the site owner only.</p>

<div id="tools" hidden>
<h2>Slack</h2>
<form id="slack-form">
  <label>Channel <input id="slack-channel" placeholder="#channel, C0123 or U0123" required></label><br>
  <label>Text <input id="slack-text" value="Pets smoke test" size="40" required></label><br>
  <button type="submit">Send</button>
</form>
<pre id="slack-out"></pre>

<h2>AI</h2>
<form id="ai-form">
  <label>Prompt<br><textarea id="ai-prompt" rows="4" cols="60" required>Say hello in one short sentence.</textarea></label><br>
  <button type="submit">Ask</button>
</form>
<label>Output<br><textarea id="ai-out" rows="8" cols="60" readonly></textarea></label>
<pre id="ai-meta"></pre>

<h2>AI image</h2>
<form id="image-form">
  <label>Prompt<br><textarea id="image-prompt" rows="3" cols="60" required>A small red circle on a white background.</textarea></label><br>
  <button type="submit">Generate</button>
</form>
<pre id="image-meta"></pre>
<img id="image-out" alt="" style="max-width: 512px; display: none">
</div>

<script src="/spot.js"></script>
<script>
function show(id, value) {
  document.getElementById(id).textContent =
    typeof value === 'string' ? value : JSON.stringify(value, null, 2);
}
function errText(e) {
  return 'ERROR ' + (e.status || '') + ' ' + (e.code || '') + ' ' + (e.message || e);
}

// Owner-only, client side. Spot has no per-path access control, so anyone
// who can visit the site can load this HTML; the forms stay hidden unless
// the visitor's identity matches the owner. AI and Slack are open to all
// visitors on production, so ai_allowed and slack_allowed are not signals
// here. Reach this page by typing /test/; nothing links to it.
var OWNER = 'dmitry.mogilev@t1a.com';
spot.me().then(function (me) {
  if ((me.email || '').toLowerCase() === OWNER) {
    show('me', me);
    document.getElementById('tools').hidden = false;
  } else {
    show('me', me.email || '(unknown)');
    document.getElementById('denied').hidden = false;
  }
}).catch(function (e) { show('me', errText(e)); });

document.getElementById('slack-form').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  show('slack-out', 'sending...');
  try {
    const res = await spot.slack.send({
      channel: document.getElementById('slack-channel').value.trim(),
      text: document.getElementById('slack-text').value,
    });
    show('slack-out', res);
  } catch (e) {
    show('slack-out', errText(e));
  }
});

document.getElementById('ai-form').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  const out = document.getElementById('ai-out');
  out.value = '';
  show('ai-meta', 'streaming...');
  try {
    const res = await spot.ai.stream(
      [{ role: 'user', content: document.getElementById('ai-prompt').value }],
      { onToken: function (delta, text) { out.value = text; } },
    );
    out.value = res.text;
    show('ai-meta', { model: res.model, stop_reason: res.stop_reason, usage: res.usage });
  } catch (e) {
    show('ai-meta', errText(e));
  }
});

document.getElementById('image-form').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  const img = document.getElementById('image-out');
  img.style.display = 'none';
  img.removeAttribute('src');
  show('image-meta', 'generating...');
  try {
    const res = await spot.ai.image(document.getElementById('image-prompt').value);
    const first = (res.images || [])[0];
    if (!first) throw new Error('no images in response');
    // The response carries base64 PNG bytes in `b64` and a ready-made `data_url`.
    img.src = first.data_url || ('data:' + (first.mime_type || 'image/png') + ';base64,' + first.b64);
    img.style.display = 'block';
    show('image-meta', { provider: res.provider, model: res.model, count: res.images.length, mime_type: first.mime_type });
  } catch (e) {
    show('image-meta', errText(e));
  }
});
</script>
</body>
</html>
