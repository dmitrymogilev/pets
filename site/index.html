<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pets</title>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand">
    <a class="brand-name" href="/">Pets</a>
    <p class="tagline">Virtual pets for the team. Care for one, and its reaction lands in Slack, so colleagues get to know each other.</p>
  </div>
  <div class="top-actions stack">
    <nav class="top-nav" aria-label="Pages"><a href="/about/">About</a><a href="/deaths/">Death list</a></nav>
    <div class="top-row">
      <label class="theme-switch" id="theme-switch"></label>
      <span id="sound-toggle"></span>
      <a class="btn btn-primary" href="/create/">Create a pet</a>
    </div>
  </div>
</header>

<main>
<p id="status" class="status">Loading pets...</p>
<div id="errors" class="errors" hidden><h2>Something went wrong</h2><ul id="error-list"></ul></div>
<div id="gallery" class="gallery"></div>
</main>
</div>

<script src="/spot.js"></script>
<script src="/pets.js"></script>
<script src="/sounds.js"></script>
<script>
(async function () {
  const { el, db, strip, effectiveState, label, ageDays, careText, avatarNode, errorLog, runDigests, hoursAgo, humanDuration, needsAttention, isDead, recordDeath } = Pets;
  const errors = errorLog(document.getElementById('error-list'));
  const gallery = document.getElementById('gallery');
  const status = document.getElementById('status');
  PetsTheme.switcher(document.getElementById('theme-switch'));
  PetsSounds.toggle(document.getElementById('sound-toggle'));

  let me = null;
  try { me = await spot.me(); } catch (e) { errors.add('identity', e); }

  const pets = {};
  const states = {};
  const deaths = {}; // pet id -> death record
  const recording = new Set();

  // A Hard Core pet whose health reached zero leaves the gallery for the
  // death list. The first viewer to see it writes the death record.
  function dead(pet, eff) {
    if (deaths[pet.id]) return true;
    if (!isDead(pet, eff)) return false;
    if (!recording.has(pet.id)) {
      recording.add(pet.id);
      recordDeath(pet, eff).then((d) => { deaths[pet.id] = d; }).catch((e) => errors.add('death record ' + pet.name, e));
    }
    return true;
  }

  function chip(text, low, extra) {
    return el('li', { class: 'chip' + (low ? ' low' : '') + (extra ? ' ' + extra : ''), text });
  }

  function render() {
    gallery.replaceChildren();
    const now = Date.now();
    const list = Object.values(pets).filter((p) => !p.dismissed_at)
      .filter((p) => !dead(p, states[p.id] ? effectiveState(states[p.id], now) : null))
      .sort((a, b) => b.created_at.localeCompare(a.created_at));
    status.textContent = list.length ? list.length + ' pet' + (list.length === 1 ? '' : 's') : 'No pets yet. Create the first one.';
    list.forEach((pet) => {
      const st = states[pet.id];
      const eff = st ? effectiveState(st, now) : null;
      const link = '/pet/?id=' + encodeURIComponent(pet.id);
      const kind = pet.kind === 'custom' ? 'Custom pet' : Pets.templateByKey(pet.kind).name;
      const age = ageDays(pet.created_at, now);
      const children = [
        el('a', { class: 'card-avatar', href: link, 'aria-label': 'Open ' + pet.name }, [avatarNode(pet, 112)]),
        el('h2', { class: 'card-name' }, [el('a', { href: link, text: pet.name })]),
        el('p', { class: 'card-kind', text: kind + ', ' + (age === 0 ? 'hatched today' : age + ' day' + (age === 1 ? '' : 's') + ' old') + (pet.hardcore ? ' · Hard Core' : '') }),
      ];
      if (eff) {
        children.push(el('ul', { class: 'chips', 'aria-label': 'State' }, [
          chip(eff.mood_word || label('mood', eff.mood), eff.mood < 40, 'mood'),
          chip(label('food', eff.food), eff.food < 25),
          chip(label('health', eff.health), eff.health < 50),
        ]));
        if (needsAttention(eff).length) children.push(el('span', { class: 'badge', text: 'Needs care' }));
      }
      children.push(el('p', { class: 'card-desc', text: pet.description }));
      children.push(el('dl', { class: 'facts' }, [
        el('dt', { text: 'Owner' }), el('dd', { text: pet.owner }),
        el('dt', { text: 'Care' }), el('dd', {}, [Pets.careNode(pet)]),
        el('dt', { text: 'Last visit' }), el('dd', { text: eff ? (eff.last_interaction_at ? humanDuration(hoursAgo(eff.last_interaction_at, now)) + ' ago' : 'none yet') : 'unknown' }),
      ]));
      gallery.appendChild(el('article', { class: 'card' }, children));
    });
  }

  try {
    const [petDocs, stateDocs, deathDocs] = await Promise.all([
      db.pets.list({ limit: 200 }),
      db.state.list({ limit: 200 }),
      db.deaths.list({ limit: 200 }),
    ]);
    petDocs.forEach((d) => { pets[d.id] = strip(d); });
    stateDocs.forEach((d) => { states[d.data.pet_id] = strip(d); });
    deathDocs.forEach((d) => { deaths[d.data.pet_id] = strip(d); });
    render();
  } catch (e) {
    status.textContent = 'Could not load pets.';
    errors.add('database', e);
    return;
  }

  // Live: new pets, edits, dismissals, and state changes from any visitor.
  db.pets.subscribe({
    onCreate: (d) => { pets[d.id] = strip(d); render(); },
    onUpdate: (d) => { pets[d.id] = strip(d); render(); },
    onDelete: (id) => { delete pets[id]; render(); },
    onError: (e) => errors.add('realtime pets', e),
  });
  db.state.subscribe({
    onCreate: (d) => { states[d.data.pet_id] = strip(d); render(); },
    onUpdate: (d) => { states[d.data.pet_id] = strip(d); render(); },
    onError: (e) => errors.add('realtime state', e),
  });
  db.deaths.subscribe({
    onCreate: (d) => { deaths[d.data.pet_id] = strip(d); render(); },
    onError: (e) => errors.add('realtime deaths', e),
  });
  // Decay is time-based; refresh the labels once a minute.
  setInterval(render, 60 * 1000);

  // Daily check-in per channel for pets that need attention. Any visit may
  // trigger it; the digest documents make sure only one post goes out.
  if (me) {
    runDigests(Object.values(pets).filter((p) => !deaths[p.id]), states, me, (ev) => {
      if (ev.ok) {
        const note = el('p', { class: 'status', text: 'Posted a daily check-in for ' + ev.count + ' pet' + (ev.count === 1 ? '' : 's') + ' to ' + ev.channel + '.' });
        status.after(note);
      } else {
        errors.add('digest ' + ev.channel, ev.error);
      }
    });
  }
})();
</script>
</body>
</html>
