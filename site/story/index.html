<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petopia: The Mission</title>
<style>
:root{
  --bg:#07040300;
  --clay:#cf6a2b; --light:#eaa165; --dark:#7a3a14; --ink:#120b07; --cream:#efd7a6;
  --serif:"Cinzel","Trajan Pro","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070403;color:var(--cream);font-family:var(--serif)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:12px;gap:10px}
.stage{position:relative;width:min(100vw - 24px,(100vh - 90px)*16/9);aspect-ratio:16/9;container-type:inline-size;
  background:#070403;box-shadow:0 0 60px #000,0 0 0 1px #2a1a10;overflow:hidden;border-radius:6px}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* caption band, styled like the label band of a vase */
.band{position:absolute;left:0;right:0;top:78%;height:16.4%;background:#0d0806;border-top:1px solid #4a2a14;border-bottom:1px solid #4a2a14;
  display:flex;align-items:center;justify-content:center;padding:0 9%;text-align:center}
.cap{position:absolute;left:9%;right:9%;top:50%;transform:translateY(-50%);font-size:2.05cqw;line-height:1.45;color:var(--cream);opacity:0;transition:opacity .3s;
  text-shadow:0 1px 0 #000}
.cap.show{opacity:1}
.cap .red{display:inline-block;border:1px solid var(--clay);padding:0 .35em;color:var(--light);letter-spacing:.08em;line-height:1.2;margin:0 .1em}

/* end overlay */
.end{position:absolute;inset:0;display:none;align-items:flex-start;justify-content:flex-end;padding:24px;pointer-events:none}
.end.show{display:flex}
.end button{font:inherit;font-size:1.4cqw;letter-spacing:.2em;text-transform:uppercase;color:var(--cream);background:#1a100a;border:2px solid var(--clay);padding:.6em 1.6em;cursor:pointer;pointer-events:auto}
.end button:hover{background:var(--dark)}

/* controls */
.bar{width:min(100vw - 24px,(100vh - 90px)*16/9);display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#b98b5c}
.bar button{font:inherit;color:var(--cream);background:#140d08;border:1px solid #5a3418;padding:6px 12px;cursor:pointer;border-radius:3px}
.bar button:hover{background:#2a1a10}
.bar button[aria-pressed="true"]{border-color:var(--clay);color:var(--light)}
.audio-status{margin:0;color:var(--light);font-size:14px;text-align:center}
.prog{flex:1;height:6px;background:#1f130b;border-radius:3px;position:relative;cursor:pointer}
.prog .fill{position:absolute;left:0;top:0;bottom:0;background:var(--clay);border-radius:3px;width:0}
.prog .dot{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:#2d1a0e;border:1px solid #5a3418;transform:translateX(-50%);cursor:pointer}
.prog .dot.cur{background:var(--light);border-color:var(--light)}
.time{min-width:7ch;text-align:right;font-variant-numeric:tabular-nums}

@media (max-width:600px) and (orientation:portrait){
  .stage{width:calc(100vw - 24px);aspect-ratio:auto}
  .stage svg{position:relative;aspect-ratio:16/9;height:auto}
  .band{position:relative;top:auto;height:144px;padding:0 6%}
  .cap{left:6%;right:6%;font-size:16px;line-height:1.4}
  .bar{width:calc(100vw - 24px);flex-wrap:wrap;justify-content:space-between;gap:8px}
  .bar button{padding:6px 9px}
  .prog{order:1;flex-basis:100%;margin:6px 7px}
  .end button{font-size:18px}
}

/* ---- vase drawing style ---- */
svg text{font-family:var(--serif)}
.fig line{stroke:var(--clay);stroke-width:14;stroke-linecap:round}
.fig path,.fig circle,.fig rect,.fig ellipse{fill:var(--clay)}
.fig .ink{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.fig .inkfill{fill:var(--ink);stroke:none}
.fig .arm,.fig .fore,.fig .leg,.fig .shin{transform:rotate(var(--r,0deg))}
.fig.dark line{stroke:var(--dark)} .fig.dark path,.fig.dark circle,.fig.dark rect{fill:var(--dark)}
.fig.dark .inkfill{fill:#2a1208}
.fig.ghost{opacity:0}
.dog line{stroke:var(--clay);stroke-width:11;stroke-linecap:round}
.dog path,.dog circle,.dog ellipse{fill:var(--clay)}
.dog .tailp{fill:none;stroke:var(--clay);stroke-width:9;stroke-linecap:round}
.dog .inkfill{fill:var(--ink)} .dog .ink{fill:none;stroke:var(--ink);stroke-width:2.5} .dog .ear{stroke:var(--ink);stroke-width:2}
.dog .dleg,.dog .tail,.dog .dhead{transform:rotate(var(--r,0deg))}
.cat path,.cat circle{fill:var(--clay)} .cat .inkfill{fill:var(--ink)} .cat .tailp{fill:none;stroke:var(--clay);stroke-width:8;stroke-linecap:round}
.clay{fill:var(--clay)} .light{fill:var(--light)} .dark{fill:var(--dark)} .ink{fill:var(--ink)} .cream{fill:var(--cream)}
.ln{fill:none;stroke:var(--clay);stroke-width:3} .lnk{fill:none;stroke:var(--ink);stroke-width:2.5}
.col .ink{fill:none;stroke:var(--ink);stroke-width:2.5}
.leaf{fill:var(--clay)}
.plaque .t{fill:var(--cream);font-size:54px;letter-spacing:.18em;text-anchor:middle}
.plaque .s{fill:var(--light);font-size:22px;letter-spacing:.35em;text-anchor:middle}

/* ---- scenes ---- */
.scene{opacity:0;transition:opacity .45s}
.scene.active{opacity:1}
.scene:not(.on){visibility:hidden}
.stage.paused *{animation-play-state:paused}
.stage.awaiting-play .title,.stage.awaiting-play .title .sub,.stage.awaiting-play .title .deco{animation:none;opacity:1}

/* generic */
@keyframes drift{to{transform:translateX(-80px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.4deg)}50%{transform:translateY(9px) rotate(1.4deg)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes wag{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
@keyframes wagsit{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
@keyframes flash{0%,100%{opacity:0}8%{opacity:.55}16%{opacity:0}26%{opacity:.35}36%{opacity:0}}
@keyframes fadein{to{opacity:1}}
@keyframes popin{0%{transform:scale(0) rotate(-8deg);opacity:0}70%{transform:scale(1.12) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(-3deg);opacity:1}}
@keyframes unroll{to{transform:scaleX(1)}}
@keyframes swingA{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes swingB{from{transform:rotate(26deg)}to{transform:rotate(-26deg)}}
@keyframes armA{from{transform:rotate(18deg)}to{transform:rotate(-18deg)}}
@keyframes armB{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes dlegA{from{transform:rotate(-32deg)}to{transform:rotate(32deg)}}
@keyframes dlegB{from{transform:rotate(32deg)}to{transform:rotate(-32deg)}}
@keyframes heart{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-220px) scale(1.1);opacity:0}}
@keyframes flicker{0%,100%{transform:scaleY(1) scaleX(1)}30%{transform:scaleY(1.15) scaleX(.9)}60%{transform:scaleY(.9) scaleX(1.08)}}
@keyframes pulse{0%,100%{opacity:.08}50%{opacity:.22}}
@keyframes spin{to{transform:rotate(1800deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

.on .stars circle{animation:twinkle 2.6s ease-in-out infinite}
.on .stars circle:nth-child(2n){animation-delay:-1.3s}
.on .stars circle:nth-child(3n){animation-delay:-.7s;animation-duration:3.4s}
.on .waves{animation:drift 2.8s linear infinite}
.on .ship{animation:bob 4s ease-in-out infinite}

/* s1 title */
.on .title{opacity:0;animation:fadein 1.4s .3s forwards}
.on .title .sub{opacity:0;animation:fadein 1.2s 1.8s forwards}
.on .title .deco{opacity:0;animation:fadein 1.2s 1s forwards}

/* s2 prayer */
.on .odysseus .arm-r{animation:raiseR 1.6s 1.6s ease-in-out forwards}
.on .odysseus .arm-l{animation:raiseL 1.6s 1.6s ease-in-out forwards}
@keyframes raiseR{to{transform:rotate(-150deg)}} @keyframes raiseL{to{transform:rotate(-135deg)}}
.on .glow{opacity:0;animation:glowin 2s 4.5s forwards} @keyframes glowin{to{opacity:1}}
.on .ray{opacity:0;animation:fadein 1.8s 5s forwards}

/* s3 olympus */
.on .flash{animation:flash 2.4s .3s forwards}
.on .zeus .arm-r{animation:zeusbolt 1.2s .4s ease-out forwards} @keyframes zeusbolt{to{transform:rotate(-165deg)}}
.on .map{transform:scaleX(0);animation:unroll 1.6s 2.2s ease-out forwards}
.on .pointer .arm-r{animation:pointR 1s 3.4s ease-out forwards} @keyframes pointR{to{transform:rotate(-38deg)}}
.on .pointer .fore-r{animation:pointF 1s 3.4s ease-out forwards} @keyframes pointF{to{transform:rotate(55deg)}}
.on .tablet{opacity:0;transform:scale(0);animation:popin .9s 4.8s cubic-bezier(.3,1.4,.5,1) forwards}
.on .foes-hint{opacity:0;animation:fadein 1.5s 6.5s forwards}

/* s4 twenty years */
.on .orbit{animation:spin 7.5s linear forwards}
.on .foes{animation:foesin 7.5s 2.2s ease-in-out forwards}
@keyframes foesin{0%{transform:translateX(620px)}30%{transform:translateX(0)}55%{transform:translateX(0)}100%{transform:translateX(640px)}}
.on .foes .leg-l{animation:swingA .45s ease-in-out 5 alternate 2.2s} .on .foes .leg-r{animation:swingB .45s ease-in-out 5 alternate 2.2s}
.on .guard{animation:guardin 1.2s 4.2s forwards} @keyframes guardin{to{opacity:.62}}
.on .aegis{opacity:0;animation:aegis 1s 4.4s forwards,pulse 2.2s 5.4s ease-in-out infinite} @keyframes aegis{to{opacity:.16}}
.on .foes .arm-r{animation:spearup .8s 4.8s ease-out forwards} @keyframes spearup{to{transform:rotate(-10deg)}}

/* s5 return */
.on .ship2{animation:sailin 3.2s ease-out forwards} @keyframes sailin{from{transform:translateX(-700px)}to{transform:translateX(0)}}
.on .walker{animation:walkin 3s 2.6s linear forwards} @keyframes walkin{from{transform:translateX(0)}to{transform:translateX(250px)}}
.on .walker .leg-l{animation:swingA .5s 2.6s ease-in-out 6 alternate} .on .walker .leg-r{animation:swingB .5s 2.6s ease-in-out 6 alternate}
.on .walker .arm-l{animation:armA .5s 2.6s ease-in-out 6 alternate} .on .walker .arm-r{animation:armB .5s 2.6s ease-in-out 6 alternate}

/* s6 to earth */
.on .zeus2 .arm-r{animation:bless 1.6s 1s ease-in-out forwards} @keyframes bless{to{transform:rotate(-48deg)}}
.on .beam{opacity:0;animation:beamin 1.6s 2.8s ease-out forwards} @keyframes beamin{to{opacity:.2}}
.on .spark{opacity:0;animation:sparkfall 2.4s linear infinite;animation-delay:calc(3s + var(--d))}
@keyframes sparkfall{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(300px);opacity:0}}
.on .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker .6s ease-in-out infinite}
.on .scroll{transform:scaleX(0);animation:unroll 1.4s 5.2s ease-out forwards}
.on .worker .fore-r{animation:draw 1.8s ease-in-out infinite alternate} @keyframes draw{from{transform:rotate(var(--r))}to{transform:rotate(calc(var(--r) + 4deg))}}
.on .artisan .fore-r{animation:draw 2.4s ease-in-out infinite alternate}

/* s7 petopia */
.on .phone{transform:scale(0);animation:phonein 1.3s .3s cubic-bezier(.3,1.3,.5,1) forwards} @keyframes phonein{to{transform:scale(1)}}
.on .phone .logo{opacity:0;animation:fadein 1s 1.6s forwards}
.on .tablet2{opacity:0;transform:scale(.6);animation:tabin 1.2s 2.2s ease-out forwards} @keyframes tabin{to{opacity:1;transform:scale(1)}}
.on .fromL{animation:fromL 3s .6s ease-out forwards} @keyframes fromL{from{transform:translateX(-520px)}to{transform:translateX(0)}}
.on .fromR{animation:fromR 3s .6s ease-out forwards} @keyframes fromR{from{transform:translateX(520px)}to{transform:translateX(0)}}
.on .fromL .leg-l,.on .fromR .leg-l{animation:swingA .5s .6s ease-in-out 6 alternate} .on .fromL .leg-r,.on .fromR .leg-r{animation:swingB .5s .6s ease-in-out 6 alternate}
.on .cat{opacity:0;animation:fadein 1s 3.4s forwards}
.on .hearts2 path{opacity:0;animation:heart 3s ease-out infinite;animation-delay:calc(3.6s + var(--d))}
.on .olive{opacity:0;animation:fadein 1.5s 1s forwards}
.on .companion .tail{animation:wag .5s ease-in-out infinite alternate}
.on .companion .eye{transform-box:fill-box;transform-origin:center;animation:blink 3.2s infinite}

/* s8 follows the homecoming: the treasure is revealed before the mission continues */
.reveal-dog,.embrace-hands,.reveal-light{opacity:0}
.on .chest-opening .lid{animation:open-chest 1.8s 1.5s ease-in-out forwards}
@keyframes open-chest{to{transform:rotate(105deg)}}
.on .reveal-light{animation:reveal-light 4s 2s ease-in-out forwards}
@keyframes reveal-light{0%,100%{opacity:0}30%,65%{opacity:.32}}
.on .reveal-lean{animation:lean-to-chest 6.4s ease-in-out forwards}
@keyframes lean-to-chest{0%,100%{transform:rotate(0)}25%,50%{transform:rotate(18deg)}75%{transform:rotate(4deg)}}
.on .reveal-odysseus .arm-r{animation:reach-and-cradle 6.4s ease-in-out forwards}
@keyframes reach-and-cradle{0%{transform:rotate(10deg)}25%,50%{transform:rotate(-45deg)}100%{transform:rotate(-65deg)}}
.on .reveal-odysseus .arm-l{animation:cradle-arm 1.5s 4.9s ease-in-out forwards}
@keyframes cradle-arm{to{transform:rotate(-65deg)}}
.on .reveal-odysseus .fore-r{animation:cradle-right 1.5s 4.9s ease-in-out forwards}
@keyframes cradle-right{to{transform:rotate(75deg)}}
.on .reveal-odysseus .fore-l{animation:cradle-left 1.5s 4.9s ease-in-out forwards}
@keyframes cradle-left{to{transform:rotate(30deg)}}
.on .reveal-dog{animation:out-of-chest 3.1s 3.2s ease-in-out forwards}
@keyframes out-of-chest{
  0%{opacity:1;transform:translate(0,20px) scale(.55)}
  28%{opacity:1;transform:translate(0,-85px) scale(1)}
  58%{opacity:1;transform:translate(-80px,-150px) rotate(-15deg)}
  100%{opacity:1;transform:translate(-85px,-100px) rotate(-8deg)}
}
.on .reveal-dog .tail{animation:wag .28s 3.2s ease-in-out infinite alternate}
.on .reveal-dog .eye{transform-box:fill-box;transform-origin:center;animation:blink 3.2s 5s infinite}
.on .embrace-hands{animation:fadein .7s 5.8s forwards}
.on .reunion-hearts path{opacity:0;animation:heart 3.5s ease-out infinite;animation-delay:calc(6.5s + var(--d))}
</style>
</head>
<body>
<div class="stage awaiting-play" id="stage">
  <svg id="svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="Petopia: the story of the mission"></svg>
  <div class="band"><div class="cap" id="capA"></div><div class="cap" id="capB"></div></div>
  <div class="end" id="end"><button id="replay">Replay</button></div>
</div>
<div class="bar">
  <button id="play" aria-label="Play or pause">Play</button>
  <button id="restart">Restart</button>
  <div class="prog" id="prog"><div class="fill" id="fill"></div></div>
  <div class="time" id="time">0:00</div>
  <button id="voice" aria-pressed="true" title="Turn the recorded narration on or off">Voice</button>
  <button id="full">Full</button>
</div>
<audio id="narration" src="narration.m4a" preload="auto"></audio>
<p id="audioStatus" class="audio-status" role="status" hidden></p>

<script>
/* ---------- drawing helpers (red-figure vase style, flat clay silhouettes with black detail) ---------- */
const svgNS = 'http://www.w3.org/2000/svg';

// A human figure. Origin at the ground between the feet, facing +x. Angles in degrees; negative = forward/up.
function fig(o){
  const s=o.s||1, fl=o.flip?-1:1;
  const [aL,aR]=o.arms||[0,0], [fL,fR]=o.fore||[0,0], [lL,lR]=o.legs||[0,0], [sL,sR]=o.shins||[0,0];
  // Opt-in articulated silhouettes keep both arms and five-finger hands readable
  // in the Olympus workshop without changing the other scenes' characters.
  const hand=`<g class="hand"><path d="M-5,39 L5,39 L6,45 L6,55 Q6,58 4,58 L3,58 L3,60 Q1,62 0,59 Q-2,62 -3,59 L-4,57 Q-7,59 -7,55 L-8,49 L-11,46 Q-13,42 -10,42 L-5,46Z"/><path class="ink" style="stroke-width:1.1" d="M3,49 L3,56 M0,50 L0,57 M-3,50 L-3,56 M-6,47 Q-2,45 3,46"/></g>`;
  const arm=(side,a,f,prop='')=>`<g transform="translate(${(side==='l'?-1:1)*(o.preciseHands?28:22)},-160)"><g class="arm arm-${side}" style="--r:${a}deg">${o.preciseHands?'<path d="M-7,0 Q-10,18 -6,44 Q0,51 6,44 Q9,22 7,0Z"/>':'<line x1="0" y1="0" x2="0" y2="46"/>'}<g transform="translate(0,46)"><g class="fore fore-${side}" style="--r:${f}deg">${o.preciseHands?`<path d="M-6,0 Q-8,20 -5,40 L5,40 Q8,20 6,0Z"/><path class="ink" style="stroke-width:1.5" d="M-4,3 Q0,6 4,3"/><g transform="scale(${side==='l'?-1:1},1)">${hand}</g>`:'<line x1="0" y1="0" x2="0" y2="42"/><circle cx="0" cy="46" r="7"/>'}${prop}</g></g></g></g>`;
  const leg=(side,a,f)=>`<g transform="translate(${side==='l'?-11:11},-95)"><g class="leg leg-${side}" style="--r:${a}deg"><line x1="0" y1="0" x2="0" y2="50"/><g transform="translate(0,50)"><g class="shin shin-${side}" style="--r:${f}deg"><line x1="0" y1="0" x2="0" y2="40"/><path d="M-7,36 L24,38 L24,46 L-8,46Z"/></g></g></g></g>`;
  const torso = o.long
    ? `<path d="M-26,-168 L26,-168 L31,-110 L48,-2 L-48,-2 L-31,-110Z"/><path class="ink" d="M-28,-112 L28,-112 M-12,-104 L-18,-8 M0,-104 L0,-8 M12,-104 L18,-8"/>`
    : `<path d="M-26,-168 L26,-168 L31,-110 L37,-48 L-37,-48 L-31,-110Z"/><path class="ink" d="M-28,-112 L28,-112 M-11,-104 L-15,-54 M0,-104 L0,-54 M11,-104 L15,-54"/>`;
  let head=`<line x1="0" y1="-178" x2="0" y2="-162"/><circle cx="0" cy="-190" r="17"/>`;
  if(o.hood){
    head+=`<path d="M-25,-166 C-34,-200 -18,-220 0,-220 C18,-220 34,-200 25,-166Z"/><rect class="inkfill" x="-11" y="-205" width="22" height="24"/>`;
  }else{
    head+=`<path class="inkfill" d="M-18,-193 C-23,-218 23,-218 18,-193 C14,-205 -14,-205 -18,-193Z"/>`;
    if(o.bun) head+=`<circle class="inkfill" cx="-17" cy="-199" r="8"/>`;
    head+=`<circle class="inkfill" cx="8" cy="-192" r="2.3"/>`;
    if(o.beard) head+=`<path class="inkfill" d="M3,-185 C13,-184 18,-172 11,-158 C4,-164 -3,-171 -5,-181Z"/>`;
    if(o.helmet) head+=`<path d="M-20,-192 C-22,-222 22,-222 20,-192 L20,-172 L11,-172 L8,-186 L-8,-186 L-11,-172 L-20,-172Z"/><path class="ink" d="M-20,-192 L20,-192"/><path class="inkfill" d="M-4,-216 C4,-242 30,-248 50,-232 C34,-234 24,-226 18,-212Z M-4,-216 C-18,-222 -30,-208 -36,-190 C-26,-200 -16,-208 -2,-210Z"/>`;
    else if(!o.bun) head+=`<path class="ink" d="M-16,-197 L16,-197"/>`;
  }
  return `<g class="fig ${o.cls||''}" transform="translate(${o.x},${o.y}) scale(${s*fl},${s})">${o.preciseHands?'':arm('l',aL,fL,o.propL||'')}${leg('l',lL,sL)}${torso}${leg('r',lR,sR)}${head}${o.preciseHands?arm('l',aL,fL,o.propL||''):''}${arm('r',aR,fR,o.propR||'')}</g>`;
}

// Argus. Origin at the ground, facing +x. pose: 'stand' | 'sit'
function dog(o){
  const s=o.s||1, fl=o.flip?-1:1;
  const head=(x,y,r=0)=>`<g transform="translate(${x},${y})"><g class="dhead" style="--r:${r}deg"><path d="M-16,8 C-12,-8 2,-22 16,-26 L28,-2Z"/><circle cx="18" cy="-24" r="17"/><path d="M28,-33 L54,-27 C59,-23 59,-13 53,-10 L26,-7Z"/><ellipse class="ear" cx="5" cy="-16" rx="7" ry="15" transform="rotate(14 5 -16)"/><circle class="inkfill eye" cx="27" cy="-29" r="2.8"/><circle class="inkfill" cx="55" cy="-21" r="3.4"/><path class="ink" d="M38,-12 C44,-10 50,-12 54,-15"/></g></g>`;
  let body;
  if(o.pose==='sit'){
    body=`<g transform="translate(-34,-8)"><g class="tail" style="--r:0deg"><path class="tailp" d="M0,0 C-20,2 -42,-10 -38,-32"/></g></g>
      <ellipse cx="-20" cy="-22" rx="22" ry="17"/><line x1="-20" y1="-8" x2="6" y2="-3"/>
      <path d="M-34,0 C-58,-14 -56,-62 -24,-82 C0,-96 36,-90 42,-60 L36,0Z"/>
      <line x1="22" y1="-50" x2="20" y2="0"/><line x1="34" y1="-50" x2="34" y2="0"/>
      <path class="ink" d="M8,-74 C20,-70 30,-66 36,-58"/>${head(34,-80,-6)}`;
  }else{
    body=`<g transform="translate(-50,-66)"><g class="tail" style="--r:0deg"><path class="tailp" d="M0,0 C-16,-8 -28,-30 -14,-54"/></g></g>
      <g transform="translate(-38,-50)"><g class="dleg dleg-bl"><line x1="0" y1="0" x2="0" y2="50"/></g></g>
      <g transform="translate(34,-50)"><g class="dleg dleg-fl"><line x1="0" y1="0" x2="0" y2="50"/></g></g>

  }
  return `<g class="${cls}" transform="translate(${x},${y}) scale(${s}) rotate(${rot})"><path class="ln" stroke-width="5" d="M0,0 C60,-10 130,-30 200,-60"/>${leaves}</g>`;

function stars(n,seed){

  return `<g class="stars">${s}</g>`;
}

function waves(y){

}

    [0.420045351,`Zeus heard Odysseus's prayers and created a special mission among the gods. The project was named "${R('[REDACTED]')}".`],

const total=scenes.reduce((a,s)=>a+s.dur,0);

function roman(n){const m=[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let r='';for(const [v,k] of m){while(n>=v){r+=k;n-=v}}return r}
function yearsTick(local){
  const duration=scenes.find(s=>s.id==='s4').dur;
  const n=Math.max(1,Math.min(20,1+Math.floor(local/(duration-0.5)*20)));
  const el=document.querySelector('#s4 .years'); if(el && el.dataset.n!=n){el.dataset.n=n;el.textContent='YEAR '+roman(n)}
}

/* ---------- build ---------- */
const svg=document.getElementById('svg');
let html=`<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#2b1b10"/><stop offset=".55" stop-color="#150d08"/><stop offset="1" stop-color="#070403"/></radialGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#f3b06a" stop-opacity=".75"/><stop offset="1" stop-color="#f3b06a" stop-opacity="0"/></radialGradient>
  <pattern id="meander" width="40" height="30" patternUnits="userSpaceOnUse"><path d="M0,28 V3 H32 V19 H16 V11 H24" fill="none" stroke="#cf6a2b" stroke-width="4"/></pattern>
  <pattern id="meander-s" width="20" height="15" patternUnits="userSpaceOnUse"><path d="M0,14 V1.5 H16 V9.5 H8 V5.5 H12" fill="none" stroke="#cf6a2b" stroke-width="2"/></pattern>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer></filter>
  <symbol id="palmette" viewBox="-44 -66 88 76"><g fill="#cf6a2b">
    ${[-75,-50,-25,0,25,50,75].map((a,i)=>`<ellipse rx="5" ry="${[18,23,26,28,26,23,18][i]}" transform="rotate(${a}) translate(0,-30)"/>`).join('')}
    <circle cx="0" cy="-2" r="7"/><circle cx="-20" cy="2" r="6"/><circle cx="20" cy="2" r="6"/></g>
    <circle cx="-20" cy="2" r="2.5" fill="#120b07"/><circle cx="20" cy="2" r="2.5" fill="#120b07"/></symbol>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" filter="url(#grain)" opacity=".9"/>`;
scenes.forEach(s=>{html+=`<g class="scene" id="${s.id}">${s.build()}</g>`});
html+=`<rect x="0" y="0" width="1600" height="52" fill="#0d0806"/><rect x="0" y="848" width="1600" height="52" fill="#0d0806"/>
<rect x="0" y="10" width="1600" height="30" fill="url(#meander)"/><rect x="0" y="856" width="1600" height="30" fill="url(#meander)"/>
<path class="ln" d="M0,51 H1600 M0,848 H1600"/>`;
svg.innerHTML=html;

/* ---------- timeline engine ---------- */
const stage=document.getElementById('stage'), els=scenes.map(s=>document.getElementById(s.id));
const capEls=[document.getElementById('capA'),document.getElementById('capB')];
const fill=document.getElementById('fill'), timeEl=document.getElementById('time'), playBtn=document.getElementById('play');
const endEl=document.getElementById('end'), voiceBtn=document.getElementById('voice'), prog=document.getElementById('prog');
const narration=document.getElementById('narration'), audioStatus=document.getElementById('audioStatus');
let t=0, playing=false, cur=-1, capIdx=-1, capSlot=0, voice=true, raf=0, playRequest=0;
const dots=scenes.map((s,i)=>{const d=document.createElement('div');d.className='dot';d.title=s.id;d.style.left=(scenes.slice(0,i).reduce((a,x)=>a+x.dur,0)/total*100)+'%';d.addEventListener('click',e=>{e.stopPropagation();seek(scenes.slice(0,i).reduce((a,x)=>a+x.dur,0));});prog.appendChild(d);return d;});
prog.addEventListener('click',e=>{const r=prog.getBoundingClientRect();seek((e.clientX-r.left)/r.width*total)});

const anims=el=>el.getAnimations({subtree:true}).filter(a=>!(window.CSSTransition&&a instanceof CSSTransition));
// Fit each illustrated sequence to its trimmed recording without changing the voice.
const motionRate=idx=>scenes[idx].motionDuration/scenes[idx].dur;
const motionTime=(idx,local)=>local*motionRate(idx)*1000;
const formatTime=seconds=>{const whole=Math.floor(seconds);return Math.floor(whole/60)+':'+String(whole%60).padStart(2,'0')};
function sceneAt(time){let acc=0;for(let i=0;i<scenes.length;i++){if(time<acc+scenes[i].dur)return[i,acc];acc+=scenes[i].dur}return[scenes.length-1,acc-scenes[scenes.length-1].dur]}
function setCaption(htmlText){
  capEls[capSlot].classList.remove('show'); capSlot^=1;
  const el=capEls[capSlot]; el.innerHTML=htmlText; el.classList.toggle('show',!!htmlText);
}
function activate(idx,local){
  if(cur>=0 && cur!==idx){const p=els[cur];p.classList.remove('active');setTimeout(()=>{if(!p.classList.contains('active'))p.classList.remove('on')},500)}
  cur=idx;capIdx=-2;
  const el=els[idx];
  if(el.classList.contains('on')){el.classList.remove('on');void el.getBoundingClientRect()}
  el.classList.add('on','active');
  anims(el).forEach(a=>{a.playbackRate=motionRate(idx);a.currentTime=motionTime(idx,local);playing?a.play():a.pause()});
  dots.forEach((d,i)=>d.classList.toggle('cur',i===idx));
}
function update(){
  if(t>=total){t=total;stop();endEl.classList.add('show')}
  const [idx,start]=sceneAt(t), local=t-start;
  if(idx!==cur) activate(idx,local);
  const caps=scenes[idx].caps;let ci=-1;for(let i=0;i<caps.length;i++)if(local>=caps[i][0])ci=i;
  if(ci!==capIdx){capIdx=ci;setCaption(ci<0?'':caps[ci][1])}
  if(scenes[idx].tick)scenes[idx].tick(local);
  // Keep the illustrated motion on the recording's clock, including after buffering.
  anims(els[idx]).forEach(a=>{if(Math.abs((a.currentTime||0)-motionTime(idx,local))>120)a.currentTime=motionTime(idx,local)});
  fill.style.width=(t/total*100)+'%';
  timeEl.textContent=formatTime(t)+' / '+formatTime(total);
}
function frame(){if(!playing)return;t=Math.min(total,narration.currentTime);update();if(playing)raf=requestAnimationFrame(frame)}
function play(){
  if(playing)return;
  if(t>=total){t=0;cur=-1;els.forEach(el=>el.classList.remove('on','active'))}
  endEl.classList.remove('show');stage.classList.remove('awaiting-play');audioStatus.hidden=true;
  narration.currentTime=t;narration.muted=!voice;
  const request=++playRequest;
  playing=true;stage.classList.remove('paused');playBtn.textContent='Pause';
  if(cur>=0)anims(els[cur]).forEach(a=>a.play());
  update();raf=requestAnimationFrame(frame);
  narration.play().catch(error=>{
    if(request!==playRequest||error.name==='AbortError')return;
    stop();audioStatus.textContent=error.name==='NotAllowedError'?'Press Play to start the story with sound.':'The narration could not load. Reload the page to try again.';audioStatus.hidden=false;
  });
}
function stop(){++playRequest;playing=false;narration.pause();stage.classList.add('paused');playBtn.textContent='Play';cancelAnimationFrame(raf);if(cur>=0)anims(els[cur]).forEach(a=>a.pause())}
function seek(time){t=Math.max(0,Math.min(total-0.001,time));endEl.classList.remove('show');const [idx,start]=sceneAt(t);
  if(idx===cur){anims(els[cur]).forEach(a=>{a.currentTime=motionTime(idx,t-start);if(!playing)a.pause()});capIdx=-2}else activate(idx,t-start);
  narration.currentTime=t;update()}
playBtn.addEventListener('click',()=>playing?stop():play());
document.getElementById('restart').addEventListener('click',()=>{seek(0);play()});
document.getElementById('replay').addEventListener('click',()=>{seek(0);play()});
voiceBtn.addEventListener('click',()=>{voice=!voice;voiceBtn.setAttribute('aria-pressed',voice);narration.muted=!voice});
narration.addEventListener('ended',()=>{t=total;update()});
narration.addEventListener('error',()=>{stop();audioStatus.textContent='The narration could not load. Reload the page to try again.';audioStatus.hidden=false});
document.getElementById('full').addEventListener('click',()=>{document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen&&stage.requestFullscreen()});
stage.addEventListener('click',e=>{if(e.target.closest('button'))return;playing?stop():play()});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing?stop():play()}else if(e.code==='ArrowRight'){seek(t+5)}else if(e.code==='ArrowLeft'){seek(t-5)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)stop()});

activate(0,0);
stop();update();
window.movie={seek,play,stop,scenes,get t(){return t},total};
</script>
